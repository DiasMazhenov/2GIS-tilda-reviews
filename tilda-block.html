<!-- 2GIS Reviews | Tilda T123: replace data-* settings and paste the complete file -->
<section class="gis-reviews" data-gis-reviews data-branch-id="YOUR_BRANCH_ID" data-api-key="YOUR_PUBLIC_WIDGET_KEY" data-reviews-url="https://2gis.kz/firm/YOUR_BRANCH_ID/tab/reviews" data-title="ОТЗЫВЫ НАШИХ ПАЦИЕНТОВ" data-subtitle="Спасибо за ваше доверие" data-display-limit="6" data-search-limit="200" data-positive-min="4">
  <header class="gis-header"><div><p class="gis-label"></p><h2 class="gis-title"></h2></div><a class="gis-link" target="_blank" rel="noopener noreferrer">Все отзывы в 2ГИС ↗</a></header>
  <p class="gis-summary" aria-live="polite">Загружаем рейтинг…</p>
  <div class="gis-grid" aria-label="Отзывы"></div>
  <div class="gis-actions"><button type="button" class="gis-load-more" hidden>Загрузить ещё 3 <span aria-hidden="true">↓</span></button></div>
  <p class="gis-status" role="status">Загружаем отзывы…</p>
  <p class="gis-note">Отзывы из 2ГИС · последние доступные отзывы</p>
</section>
<style>
.gis-reviews{--gis-accent:#24785e;--gis-ink:#203b32;--gis-bg:#faf3e1;box-sizing:border-box;max-width:1160px;margin:0 auto;padding:48px 24px;font-family:Arial,sans-serif;background:var(--gis-bg);color:var(--gis-ink);border-radius:24px}
.gis-reviews *{box-sizing:border-box}
.gis-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}
.gis-label{margin:0 0 12px;padding:5px 15px;border:1px solid var(--gis-accent);border-radius:20px;width:fit-content;font-size:18px;color:var(--gis-accent)}
.gis-title{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.15;font-weight:800}
.gis-link{flex-shrink:0;padding:14px 20px;border:1px solid #b9ccc1;border-radius:100px;color:var(--gis-accent)!important;text-decoration:none!important;font-size:14px}
.gis-summary{margin:0 0 24px;font-size:18px;line-height:1.5}
.gis-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gis-card{min-width:0;padding:24px;border:1px solid #e0e8df;border-radius:18px;background:#fff;box-shadow:0 5px 10px #0043411a}
.gis-author{margin:0 0 8px;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.gis-date{color:#687970;font-size:12px}
.gis-stars{color:#f0a810;letter-spacing:3px;margin:16px 0 12px;font-size:20px}
.gis-text{margin:0;font-size:18px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.gis-text.short{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.gis-more{margin-top:12px;padding:4px 0;border:0;background:none;color:var(--gis-accent);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.gis-actions{display:flex;justify-content:center;margin-top:26px}
.gis-load-more{appearance:none;cursor:pointer;border:1px solid var(--gis-accent);color:var(--gis-accent);background:transparent;border-radius:100px;padding:13px 27px;font:600 15px/1.3 Arial,sans-serif;transition:background .2s,color .2s,opacity .2s}
.gis-load-more:hover{background:var(--gis-accent);color:#fff}
.gis-load-more:disabled{opacity:.55;cursor:wait}
.gis-load-more[hidden]{display:none}
.gis-note,.gis-status{font-size:12px;line-height:1.5;color:#687970;margin:20px 0 0}
.gis-reviews :focus-visible{outline:2px solid var(--gis-accent);outline-offset:4px}
@media(max-width:900px){.gis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.gis-reviews{padding:32px 16px;border-radius:16px}.gis-header{align-items:flex-start;flex-direction:column;gap:18px}.gis-grid{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:12px}.gis-card{flex:0 0 88%;scroll-snap-align:start;padding:20px}}
</style>
<script>
(function(){
'use strict';
function init(){
document.querySelectorAll('[data-gis-reviews]').forEach(function(root){
if(root.dataset.initialized)return;
root.dataset.initialized='1';
var grid=root.querySelector('.gis-grid'),status=root.querySelector('.gis-status'),summary=root.querySelector('.gis-summary');
var branch=root.dataset.branchId,key=root.dataset.apiKey,link=root.querySelector('.gis-link');
var limit=num(root.dataset.displayLimit,6,1,30),searchLimit=num(root.dataset.searchLimit,200,1,500),min=num(root.dataset.positiveMin,4,1,5);
var marker=document.querySelector('[data-gis-doctor-reviews]');
var doctorNode=marker&&document.querySelector(marker.dataset.doctorSelector||'.doctor');
var doctorName=marker?(marker.dataset.doctorName||(doctorNode&&doctorNode.textContent)||'').trim():'';
var doctorMode=Boolean(doctorName),busy=false;
var moreButton=root.querySelector('.gis-load-more'), step=3, shown=limit;
var loaded=[], seen=new Set(), cursor=0, exhausted=false, partial=false, fallback=false, meta=null;
var pageSize=doctorMode?50:Math.max(12,limit,step);
root.querySelector('.gis-title').textContent=root.dataset.title||'Отзывы';
root.querySelector('.gis-label').textContent=root.dataset.subtitle||'';
if(/^https:\/\/(www\.)?2gis\./i.test(root.dataset.reviewsUrl||''))link.href=root.dataset.reviewsUrl;else link.hidden=true;
if(!/^\d+$/.test(branch||'')||!key||key.startsWith('YOUR_')){
summary.textContent='Отзывы в 2ГИС';status.textContent='Настройте data-branch-id и data-api-key в HTML блока.';return;
}
function num(s,d,lo,hi){var x=Number(s);return Number.isInteger(x)&&x>=lo&&x<=hi?x:d;}
function words(s){return String(s||'').toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);}
function tokens(){var p=words(doctorName);if(p.length<3)return p;
return /(вич|вна|ична|оглы|кызы)$/.test(p[1])?[p[0],p[2]]:[p[1],p[0]];}
var doctorTokens=tokens();
function same(a,b){if(a===b)return true;if(b.length<5)return false;var stem=b.slice(0,-(b.length>=7?2:1));return a.startsWith(stem)&&Math.abs(a.length-b.length)<=2;}
function matches(r){var text=words(r.text);return doctorTokens.some(function(t){return text.some(function(w){return same(w,t);});});}
function valid(r){return r&&!r.is_hidden&&!r.hiding_reason&&typeof r.text==='string'&&Boolean(r.text.trim());}
function positive(r){return valid(r)&&Number(r.rating)>=min;}
function el(tag,cls,txt){var n=document.createElement(tag);n.className=cls;n.textContent=txt||'';return n;}
function card(r){
var c=el('article','gis-card');c.append(el('div','gis-author',(r.user&&r.user.name)||'Пользователь 2ГИС'));
var date=new Date(r.date_created);
if(!Number.isNaN(date.getTime())){var t=el('time','gis-date',date.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}));t.dateTime=date.toISOString();c.append(t);}
var rating=Number(r.rating);
if(Number.isInteger(rating)&&rating>=1&&rating<=5){var s=el('p','gis-stars','★'.repeat(rating)+'☆'.repeat(5-rating));s.setAttribute('aria-label',rating+' из 5');c.append(s);}
var p=el('p','gis-text short',r.text);c.append(p);
var button=el('button','gis-more','Читать полностью');button.type='button';button.hidden=true;button.setAttribute('aria-expanded','false');
button.addEventListener('click',function(){var short=p.classList.toggle('short');button.textContent=short?'Читать полностью':'Свернуть';button.setAttribute('aria-expanded',String(!short));});c.append(button);return c;
}
function resize(){grid.querySelectorAll('.gis-card').forEach(function(c){var p=c.querySelector('.gis-text'),b=c.querySelector('.gis-more');if(p.classList.contains('short'))b.hidden=p.scrollHeight<=p.clientHeight+1;});}
async function fetchPage(offset,count){
var qs=new URLSearchParams({key:key,rated:'true',limit:String(count),offset:String(offset),sort_by:'date_created',fields:'meta.branch_rating,meta.branch_reviews_count'});
var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},15000);
try{var response=await fetch('https://public-api.reviews.2gis.com/2.0/branches/'+branch+'/reviews?'+qs,{signal:controller.signal,credentials:'omit'});
if(!response.ok)throw Error('HTTP '+response.status);var data=await response.json();if(!Array.isArray(data.reviews)||data.meta?.code!==200)throw Error('Invalid response');return data;
}finally{clearTimeout(timer);}
}
function reviewId(r){return String(r.id||(r.date_created+':'+(r.user?.name||'')+':'+r.text));}
function selectedReviews(){
  var relevant=doctorMode?loaded.filter(matches):loaded.filter(valid);
  fallback=doctorMode&&relevant.length===0;
  return fallback?loaded.filter(positive):relevant;
}
async function fill(minWanted){
  // Для страниц врача сканируем до searchLimit, чтобы найти упоминания.
  var maximum=doctorMode?searchLimit:Math.max(searchLimit,minWanted);
  while(!exhausted&&cursor<maximum){
    var requested=Math.min(pageSize,maximum-cursor),data;
    try{data=await fetchPage(cursor,requested);}
    catch(error){
      if(!meta)throw error;
      partial=true;exhausted=true;
      console.warn('[2GIS Reviews] Частичная загрузка',error);
      break;
    }
    if(!meta)meta=data.meta;
    cursor+=requested;
    var newIds=0;
    data.reviews.forEach(function(r){
      if(!valid(r))return;
      var id=reviewId(r);
      if(seen.has(id))return;
      seen.add(id);loaded.push(r);newIds++;
    });
    if(data.reviews.length<requested||newIds===0)exhausted=true;
    // В режиме врача дочитываем заданный лимит (включая ситуацию
    // когда пока нет упоминаний). На обычных страницах подгружаем по мере кликов.
    if(!doctorMode&&selectedReviews().length>=minWanted)break;
  }
}
function draw(){
  var available=selectedReviews(),visible=available.slice(0,shown);
  grid.replaceChildren(...visible.map(card));
  requestAnimationFrame(resize);
  if(meta){
    var rating=Number(meta.branch_rating),count=meta.branch_reviews_count;
    summary.textContent=Number.isFinite(rating)&&meta.branch_rating!=null
      ? '★ '+rating.toLocaleString('ru-RU')+' из 5'+(Number.isInteger(count)?' · Отзывов: '+count:'')+' · 2ГИС'
      : 'Отзывы в 2ГИС';
  }
  // Не обещаем дополнительную порцию, когда данных больше нет.
  moreButton.hidden=!(available.length>shown||(!exhausted&&!doctorMode));
  status.textContent=fallback
    ? 'Упоминания врача не найдены среди проверенных отзывов. Показаны отзывы клиники с оценкой '+min+'–5.'
    : doctorMode&&visible.length?'Отзывы с упоминанием: '+doctorName
    : visible.length?'':'Текстовых отзывов не найдено.';
}
async function load(initial){
  if(busy||!root.isConnected)return;
  busy=true;
  moreButton.disabled=true;
  moreButton.textContent='Загружаем…';
  if(!grid.children.length)status.textContent='Загружаем отзывы…';
  try{
    if(initial){
      // При периодическом обновлении сохраняем число раскрытых карточек.
      loaded=[];seen=new Set();cursor=0;exhausted=false;partial=false;meta=null;
    }
    await fill(shown+(doctorMode?0:1));
    draw();
  }catch(error){
    console.error('[2GIS Reviews]',error);
    if(!grid.children.length)summary.textContent='Отзывы в 2ГИС';
    status.textContent='Не удалось загрузить отзывы. Посмотрите их по ссылке на 2ГИС.';
    if(!grid.children.length)moreButton.hidden=true;
  }finally{
    busy=false;
    moreButton.disabled=false;
    moreButton.innerHTML='Загрузить ещё 3 <span aria-hidden="true">↓</span>';
  }
}
moreButton.addEventListener('click',async function(){
  if(busy)return;
  // Кнопка добавляет ровно до 3 карточек к уже показанным.
  shown+=step;
  await load(false);
});
load(true);
window.addEventListener('resize',resize);
var refresh=setInterval(function(){if(!root.isConnected){clearInterval(refresh);return;}if(!document.hidden&&!root.contains(document.activeElement))load(true);},300000);
});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
